<!DOCTYPE html>
<html>

<head>

    <title>Email Spam Classifier</title>

    <style>

        body {
            text-align: center;
        }

        button {
            background-color: blue;
            color: white;
        }

    </style>

</head>


<body>

    <h1>Email Spam Classifier</h1>


    <form method="post" action="/predict">

        <textarea
            name="email-content"
            placeholder="Enter Your Email Body"
            rows="15"
            cols="35">{{ email_text }}</textarea>

        <div>

            <button type="submit">
                Check Spam
            </button>

            <a href="/">
                Reset
            </a>

        </div>

    </form>


    {% if prediction %}

        <h2>
            Prediction: {{ prediction }}
        </h2>

    {% endif %}


</body>

</html>
